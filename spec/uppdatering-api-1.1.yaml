openapi: 3.0.1
info:
  title: Uppdateringstjänst, geodatakatalog
  version: 1.1.0
  description: >-
    Här beskrivs API:et för uppdatering av geodatakatalogen.


    En uppdatering görs genom att anropa API:et i flera steg:
      1. Registrera en mottagning.
      2. Registrera förändringar avseende domänobjekt för mottagningen.
      3. Ladda upp domänobjekt motsvarande förändringarna.


    En uppdatering hanteras av tjänsten i olika faser:
      1. Mottagnings- och valideringsfas
        * Uppladdning av domänobjekt
        * Validering av domänobjektets struktur och kontroll mot regelverk
      2. Publiceringsfas
        * Lagring och publicering av data


    Under mottagningsfasen registreras en förändring för varje domänobjekt som ska laddas upp (eller raderas). Den
    initiala statusen (för mottagning och dess förändringar) är `registrerad`, vilket betyder att systemet väntar på att
    domänobjektet ska laddas upp. När detta är gjort ändras status till `mottagen`.


    Under valideringsfasen, som sker asynkront, är det klientens uppgift att bevaka mottagningsobjektets status genom
    att (möjligtvis upprepade gånger) hämta dess status med hjälp objektets `id`. I samband med att valideringen
    genomförts får mottagningsobjektet status `validerad`, eller `valideringsfel` om något av de ingående domänobjekten
    är ogiltiga. Domänobjektet kan laddas upp på nytt om valideringen inte lyckats. Ett nytt valideringsförsök kommer då
    att göras. Det är alltså inte nödvändigt att skapa en helt ny mottagning. Efter att valideringen har genomförts,
    antingen med lyckat eller misslyckat resultat, så finns en detaljerad valideringsrapport att hämta.


    Under publiceringsfasen uppdateras geodatakatalogen. Mottagningen får status `publicerad` om allt gått bra. I detta
    fall är domänobjekten publicerade och finns tillgängliga för konsumtion i geodatakatalogen.


    Statusnivåer:
      * registrerad
      * mottagen
      * validerad
      * valideringsfel
      * publicerad
      * fel


    Mottagningsobjektets status beror av status för dess ingående förändringar:
      * statusnivåerna `mottagen`, `validerad` och `publicerad` erhålls när *alla mottagningens förändringar* har
        motsvarande status
      * statusnivåerna `valideringsfel` och `fel` erhålls när *någon av mottagningens förändringar* har motsvarande
        status


    I första hand bör klienten bevaka den aggregerade statusen på mottagningsobjektet. Vid valideringsfel
    kan klienten hämta förändringobjekten för att läsa statusen på varje enskild förändring.


  contact:
    name: Lantmäteriet
    url: 'https://www.lantmateriet.se'
servers:
  - url: 'https://api.lantmateriet.se/distribution/geodatakatalog/uppdatering/v1'
    description: Produktion
  - url: 'https://api-ver.lantmateriet.se/distribution/geodatakatalog/uppdatering/v1'
    description: Verifikation
paths:
  /mottagning:
    post:
      summary: Registrera mottagning
      description: Registrera en mottagning. En mottagning är ett sammanhållande objekt för en eller flera förändringar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skapamottagning'
            example:
              leveransinfo:
                informationstyp: detaljplan
                provider: '2180'
      responses:
        '201':
          $ref: '#/components/responses/SkapaMottagning'
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
  '/mottagning/{mottagningsid}':
    get:
      summary: Hämta mottagning
      parameters:
        - $ref: '#/components/parameters/mottagningsid'
      responses:
        '200':
          $ref: '#/components/responses/Mottagning'
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '404':
          $ref: '#/components/responses/Fel404'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
  /mottagning/{mottagningsid}/forandringar:
    post:
      summary: Registrera förändringar
      description: >-
        Registrera en eller flera förändringar av typen `leverans` för uppladdning av domänobjekt
        eller av typen `radering` för domänobjekt som ska tas bort från geodatakatalogen. Förändringens objektidentitet
        ska vara detsamma som domänobjektets objektidentitet.


        Raderingar får status `mottagen` omgående. Leveranser har från början status `registrerad`.


        Attributet `href` är valfritt och ska bara anges om producenten själv vill tillhandahålla domänobjektet.
        En eftersändning (redirect) kommer i sådant fall att registreras i geodatakatalogen till den angivna URL:en.
        Endast https-länkar tillåts.
      parameters:
        - $ref: '#/components/parameters/mottagningsid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skapaforandringar'
            example:
              forandringar:
                - objektidentitet: 153501aa-18e6-471e-905a-ff3afc29e43e
                  typ: leverans
                - objektidentitet: 51c2edeb-d5ba-4006-b70d-305a5fab725e
                  typ: leverans
                  href: 'https://valfri.url/till/filen'
                - objektidentitet: 1cdf781f-a0fc-4101-b0c0-89e7e547f31f
                  typ: radering
      responses:
        '201':
          $ref: '#/components/responses/SkapaForandringar'
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '404':
          $ref: '#/components/responses/Fel404'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
    get:
      summary: Hämta alla förändringar
      description: Hämta alla förändringar som ingår i mottagningen.
      parameters:
        - $ref: '#/components/parameters/mottagningsid'
      responses:
        '200':
          $ref: '#/components/responses/Forandringar'
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '404':
          $ref: '#/components/responses/Fel404'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
  /mottagning/{mottagningsid}/forandringar/{objektidentitet}:
    get:
      summary: Hämta enskild förändring
      description: Hämta statusen för en enskild förändring.
      parameters:
        - $ref: '#/components/parameters/mottagningsid'
        - $ref: '#/components/parameters/objektidentitet'
      responses:
        '200':
          $ref: '#/components/responses/Forandring'
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '404':
          $ref: '#/components/responses/Fel404'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
  /mottagning/{mottagningsid}/forandringar/{objektidentitet}/leverans:
    post:
      summary: Ladda upp ett domänobjekt
      description: >-
        Ladda upp ett domänobjekt på en förändring av typen `leverans`. Valideringen påbörjas så snart som möjligt efter
        ett domänobjekt fått status `mottagen`. Ett domänobjekt kan laddas upp om förändringen har status `registrerad`
        eller `valideringsfel`. Vid övriga statusar går det inte att ladda upp ett nytt domänobjekt. När ett domänobjekt
        laddas upp på en förändring med status `registrerad` eller `valideringsfel`, så ändras statusen till `mottagen`.
        När alla förändringar fått status `validerad` påbörjas publiceringsfasen.


        Filens mediatyp anger domänobjektets format, informationstyp och modellversion. Den återfinns sedan i länken
        till domänobjektet i Geodatakatalog Sökning och i `Content-Type`-headern i svaret från Geodatakatalog
        Nedladdning, så att klienter ska veta hur filen ska hanteras.
      parameters:
        - $ref: '#/components/parameters/mottagningsid'
        - $ref: '#/components/parameters/objektidentitet'
        - in: header
          name: Content-Type
          description: Filens mediatyp, t.ex `application/vnd.lm.detaljplan.v1+json`
          required: true
          schema:
            type: string
            enum:
              - application/vnd.lm.detaljplan.v1+json
              - application/vnd.lm.detaljplan.v2+json
              - application/vnd.lm.detaljplan.v3+json
              - application/vnd.lm.byggnad.v1+json
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '303':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '404':
          $ref: '#/components/responses/Fel404'
        '413':
          $ref: '#/components/responses/Fel413'
        '415':
          $ref: '#/components/responses/Fel415'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
    get:
      summary: Hämta valideringsrapport
      description: >-
        Hämta valideringsrapporten för ett levererat domänobjekt. Valideringen sker asynkront, så rapporten finns inte
        tillgänglig omgående. När förändringen har status `validerad`, `valideringsfel` eller `publicerad` går det att
        hämta rapporten.
      parameters:
        - $ref: '#/components/parameters/mottagningsid'
        - $ref: '#/components/parameters/objektidentitet'
      responses:
        '200':
          $ref: '#/components/responses/Valideringsrapport'
        '204':
          description: Rapporten har inte skapats än.
        '400':
          $ref: '#/components/responses/Fel400'
        '403':
          $ref: '#/components/responses/Fel403'
        '404':
          $ref: '#/components/responses/Fel404'
        '500':
          $ref: '#/components/responses/Fel500'
        default:
          $ref: '#/components/responses/Fel'
  /health:
    get:
      summary: Hälsokontroll
      description: En hälsokontroll som kan användas för att kontrollera att tjänsten är tillgänglig.
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthDown'
        default:
          $ref: '#/components/responses/Fel'
components:
  parameters:
    mottagningsid:
      description: Mottagningens id.
      name: mottagningsid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    objektidentitet:
      description: Domänobjektets identitet.
      name: objektidentitet
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    leveransinfo:
      description: Information om leveransen
      type: object
      properties:
        informationstyp:
          description: Domäntillhörighet, t.ex "detaljplan"
          type: string
        provider:
          description: Ägaren/producenten av informationen, t.ex kommunkod
          type: string
      required:
        - informationstyp
        - provider
    skapamottagning:
      type: object
      properties:
        leveransinfo:
          $ref: '#/components/schemas/leveransinfo'
      required:
        - leveransinfo
    redirect:
      description: En eftersändning (redirect)
      type: object
      properties:
        href:
          description: Länk till valideringsrapport
          type: string
          format: uri
      required:
        - href
    skapaforandringar:
      type: object
      properties:
        forandringar:
          description: En lista med förändringar som ingår i mottagningen.
          type: array
          minItems: 1
          items:
            properties:
              objektidentitet:
                description: Objektidentiteten för motsvarande domänobjekt.
                type: string
                format: uuid
              typ:
                description: Typ av förändring
                type: string
                enum:
                  - leverans
                  - radering
              href:
                description: >-
                  Länk till domänobjektet. Detta attribut är valfritt och ska bara anges om producenten själv vill
                  tillhandahålla domänobjektet. Endast https tillåts.
                type: string
                format: uri
            required:
              - objektidentitet
              - typ
      required:
        - forandringar
    forandring:
      type: object
      properties:
        objektidentitet:
          description: Objektidentiteten för motsvarande domänobjekt.
          type: string
          format: uuid
        typ:
          description: Typ av förändring
          type: string
          enum:
            - leverans
            - radering
        href:
          description: Eventuell länk till producentens eget tillhandhållande.
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/status'
      required:
        - status
        - objektidentitet
        - typ
    forandringar:
      type: object
      properties:
        forandringar:
          description: En lista med förändringar som ingår i mottagningen.
          type: array
          items:
            $ref: '#/components/schemas/forandring'
      required:
        - forandringar
    mottagning:
      type: object
      properties:
        id:
          description: Mottagningens id. `mottagningsid`
          type: string
          format: uuid
        leveransinfo:
          $ref: '#/components/schemas/leveransinfo'
        status:
          $ref: '#/components/schemas/status'
      required:
        - id
        - leveransinfo
        - status
    status:
      type: object
      description: Statusobjekt
      properties:
        typ:
          description: Typ av status.
          type: string
          enum:
            - registrerad
            - mottagen
            - validerad
            - valideringsfel
            - publicerad
            - fel
        tidsstampel:
          description: Tidsstämpel för den senaste statusförändringen.
          type: string
          format: 'date-time'
        felmeddelande:
          description: Eventuellt meddelande vid fel.
          type: string
      required:
        - typ
        - tidsstampel
    health:
      type: object
      properties:
        status:
          description: Tjänstens hälsostatus.
          type: string
          enum:
            - UNKNOWN
            - UP
            - DOWN
            - OUT_OF_SERVICE
      required:
        - status
  responses:
    SkapaMottagning:
      description: Mottagningsobjekt som visar status för bearbetningen.
      headers:
        Location:
          description: Länk till skapat mottagningsobjekt
          required: true
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mottagning'
          example:
            id: 5ed830cd-d561-43bd-9a4c-e481f4b6c46f
            leveransinfo:
              provider: '0980'
              informationstyp: detaljplan
            status:
              typ: registrerad
              tidsstampel: '2020-01-22T09:10:45.062+01:00'
    Mottagning:
      description: >-
        Mottagningsobjekt som visar status för bearbetningen.


        Attributet status anger en sammanhållen status för ingående förändringar. När alla ingående förändringar har
        status `mottagen`, `validerad` eller `publicerad` får mottagningen motsvarande status. När någon av
        förändringarna får status `valideringsfel` eller `fel` får mottagningen motsvarande status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mottagning'
          example:
            id: 5ed830cd-d561-43bd-9a4c-e481f4b6c46f
            leveransinfo:
              provider: '0980'
              informationstyp: detaljplan
            status:
              typ: registrerad
              tidsstampel: '2020-01-22T09:10:45.062+01:00'
    Forandring:
      description: En enskild förändring som ingår i mottagningen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/forandring'
          example:
            objektidentitet: 153501aa-18e6-471e-905a-ff3afc29e43e
            typ: leverans
            status:
              typ: registrerad
              tidsstampel: '2020-12-03T15:23:47.15+01:00'
    SkapaForandringar:
      description: En lista med förändringar som ingår i mottagningen.
      headers:
        Location:
          description: Länk till skapat förändringsobjekt
          required: true
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/forandringar'
          example:
            forandringar:
              - objektidentitet: 153501aa-18e6-471e-905a-ff3afc29e43e
                typ: leverans
                status:
                  typ: registrerad
                  tidsstampel: '2020-12-03T15:23:47.15+01:00'
              - objektidentitet: 51c2edeb-d5ba-4006-b70d-305a5fab725e
                typ: leverans
                href: 'https://valfri.url/till/filen'
                status:
                  typ: registrerad
                  tidsstampel: '2020-12-03T15:23:47.15+01:00'
              - objektidentitet: 1cdf781f-a0fc-4101-b0c0-89e7e547f31f
                typ: radering
                status:
                  typ: mottagen
                  tidsstampel: '2020-12-03T15:23:47.15+01:00'
    Forandringar:
      description: En lista med förändringar som ingår i mottagningen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/forandringar'
          example:
            forandringar:
              - objektidentitet: 153501aa-18e6-471e-905a-ff3afc29e43e
                typ: leverans
                status:
                  typ: registrerad
                  tidsstampel: '2020-12-03T15:23:47.15+01:00'
              - objektidentitet: 51c2edeb-d5ba-4006-b70d-305a5fab725e
                typ: leverans
                href: 'https://valfri.url/till/filen'
                status:
                  typ: registrerad
                  tidsstampel: '2020-12-03T15:23:47.15+01:00'
              - objektidentitet: 1cdf781f-a0fc-4101-b0c0-89e7e547f31f
                typ: radering
                status:
                  typ: mottagen
                  tidsstampel: '2020-12-03T15:23:47.15+01:00'
    Redirect:
      description: En eftersändning (redirect) till valideringsrapport.
      headers:
        Location:
          description: Länk till valideringsrapport
          required: true
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/redirect'
          example:
            href: 'https://api.lantmateriet.se/distribution/geodatakatalog/uppdatering/v1/mottagning/5ed830cd-d561-43bd-9a4c-e481f4b6c46f/leveranser/153501aa-18e6-471e-905a-ff3afc29e43e'
    Valideringsrapport:
      description: |-
        En valideringsrapport.

        Rapporten börjar med en sammanfattning av resultaten, där `tests` är antalet testfall som körts, följt av en
        summering av antalet testfall som resulterade i en status annat än `OK`. Status för testfall kan anta följande
        värden:

        * `OK` - valideringen gick igenom.
        * `FAILURE` - valideringen gick inte igenom.
        * `WARNING` - valideringen gick igenom, men det finns saker som bör korrigeras.
        * `ERROR` - valideringen kunde inte genomföras pga. ett exekveringsfel.
        * `SKIPPED` - testfallet kördes inte.

        Om status är annat än `OK` visas mer detaljerad information under `message`.
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/geodatakatalog/uppdatering/v1/validering-1.0.json'
          example:
            name: Resultat för validering av detaljplan.v1
            timestamp: "2020-10-20T14:18:33.218+02:00"
            tests: 2
            failures: 1
            warnings: 0
            errors: 0
            skipped: 0
            time: 0.074
            testcase:
              - id: '6.1-02'
                label: 'Uppgift om geometri ska finnas för alla detaljplaner.'
                time: 0
                status: OK
              - id: '6.1-03'
                label: 'Uppgift om geometri ska finnas för alla bestämmelser.'
                time: 0.074
                status: FAILURE
                message:
                  - Bestämmelsen 11111111-1111-1111-1111-1111111111111 saknar geometri
                  - Bestämmelsen 22222222-2222-2222-2222-2222222222222 saknar geometri
    Fel400:
      description: Felaktigt anrop
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/produkter/fault/v1/fault-1.0.json'
          example:
            code: 400
            reason: 'Bad request'
            errors:
              - 'Felaktigt anrop'
    Fel403:
      description: Förbjudet anrop
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/produkter/fault/v1/fault-1.0.json'
          example:
            code: 403
            reason: 'Forbidden'
            errors:
              - 'Förbjudet anrop'
    Fel404:
      description: Resursen finns inte
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/produkter/fault/v1/fault-1.0.json'
          example:
            code: 404
            reason: 'Not Found'
            errors:
              - 'Resursen finns inte'
    Fel413:
      description: Anropet innehåller för mycket data
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/produkter/fault/v1/fault-1.0.json'
          example:
            code: 413
            reason: 'Payload to large'
            errors:
              - 'Anropet innehåller för mycket data'
    Fel415:
      description: Mediatypen stöds inte
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/produkter/fault/v1/fault-1.0.json'
          example:
            code: 415
            reason: 'Unsupported Media Type'
            errors:
              - 'Mediatypen stöds inte'
    Fel500:
      description: Internt fel i tjänsten
      content:
        application/json:
          schema:
            $ref: 'http://namespace.lantmateriet.se/distribution/produkter/fault/v1/fault-1.0.json'
          example:
            code: 500
            reason: 'Internal server error'
            errors:
              - 'Internt fel'
    Fel:
      description: Övriga fel
      content:
        '*/*':
          schema:
            type: string
    HealthUp:
      description: Tjänsten mår bra
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/health'
          example:
            status: 'UP'
    HealthDown:
      description: Tjänsten mår inte bra
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/health'
          example:
            status: 'DOWN'